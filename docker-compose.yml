version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: preentrega7_redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: preentrega7_phoenix
    restart: unless-stopped
    ports:
      - 6006:6006
      - 4317:4317 # OTLP gRPC
    environment:
      - PHOENIX_PORT=6006
    volumes:
      - phoenix_data:/root/.phoenix

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: preentrega7_api
    restart: unless-stopped
    ports:
      - 8000:8000
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=
      - MODEL_NAME=
      - ENABLE_PHOENIX=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
      - LANGCHAIN_TRACING_V2=
      - LANGCHAIN_API_KEY=
      - LANGCHAIN_PROJECT=
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started

volumes:
  redis_data:
  phoenix_data:
